server:
  port: 9120
spring:
  application:
    name: alm-backend
  datasource:
    url: ${ALM_DB_URL:jdbc:postgresql://localhost:5433/almdb}
    username: ${ALM_DB_USERNAME:keycloak}
    password: ${ALM_DB_PASSWORD:keycloak}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
  servlet:
    multipart:
      max-file-size: ${ALM_MAX_ATTACHMENT_MB:20}MB
      max-request-size: ${ALM_MAX_ATTACHMENT_MB:20}MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:9000/.well-known/jwks.json}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

platform:
  jwt:
    issuer: ${PLATFORM_ISSUER:http://localhost:9000}
    audience: ${PLATFORM_AUDIENCE:platform-api}
  org-grpc:
    host: ${ORG_GRPC_HOST:localhost}
    port: ${ORG_GRPC_PORT:9131}
  grpc:
    enabled: ${ALM_GRPC_ENABLED:true}
    port: ${ALM_GRPC_PORT:9121}
  events:
    enabled: ${EVENTS_ENABLED:true}
    stream: ${EVENTS_STREAM:platform:events:v1}
  alm:
    storage:
      # 첨부 바이트 저장소. S3를 끄면 로컬 파일(개발·테스트) — 운영 compose는 MinIO를 켠다.
      files-dir: ${ALM_FILES_DIR:./data/attachments}
      s3:
        enabled: ${ALM_S3_ENABLED:false}
        bucket: ${ALM_S3_BUCKET:alm-attachments}
        region: ${ALM_S3_REGION:us-east-1}
        endpoint: ${ALM_S3_ENDPOINT:}
        path-style-access: ${ALM_S3_PATH_STYLE_ACCESS:true}
        access-key: ${ALM_S3_ACCESS_KEY:}
        secret-key: ${ALM_S3_SECRET_KEY:}

---
spring:
  config:
    activate:
      on-profile: docker
eureka:
  client:
    enabled: false
logging:
  structured:
    format:
      console: ecs

