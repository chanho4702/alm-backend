spring:
  datasource:
    url: jdbc:h2:mem:almdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
eureka:
  client:
    enabled: false
# 단위 테스트에는 Redis가 없다(이벤트 발행도 꺼 둔다) — 인디케이터를 켜 두면 헬스가 DOWN이 되어
# 액추에이터 계약 테스트가 인프라 유무에 좌우된다. 운영에서는 기본값 그대로 켜져 있다.
management:
  health:
    redis:
      enabled: false
platform:
  grpc:
    enabled: false
  events:
    enabled: false
  alm:
    trash:
      # 테스트는 잡 메서드를 직접 부른다 — 시계는 사실상 돌지 않게(매년 1월 1일)
      purge-cron: "0 0 3 1 1 *"
    storage:
      files-dir: build/test-attachments
      s3:
        enabled: false
