spring:
  datasource:
    url: jdbc:h2:mem:almdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
eureka:
  client:
    enabled: false
platform:
  grpc:
    enabled: false
  events:
    enabled: false
  alm:
    trash:
      # 테스트는 잡 메서드를 직접 부른다 — 시계는 사실상 돌지 않게(매년 1월 1일)
      purge-cron: "0 0 3 1 1 *"
    storage:
      files-dir: build/test-attachments
      s3:
        enabled: false
