server:
  port: 9120
spring:
  cloud:
    discovery:
      client:
        # 서비스 health는 자기 상태(db)만 본다 — 유레카 상태는 게이트웨이 대시보드가 eureka 컴포넌트로 따로 프로브한다(설계 §3).
        health-indicator:
          enabled: false
  application:
    name: alm-backend
  datasource:
    url: ${ALM_DB_URL:jdbc:postgresql://localhost:5433/almdb}
    username: ${ALM_DB_USERNAME:keycloak}
    password: ${ALM_DB_PASSWORD:keycloak}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
  servlet:
    multipart:
      max-file-size: ${ALM_MAX_ATTACHMENT_MB:20}MB
      max-request-size: ${ALM_MAX_ATTACHMENT_MB:20}MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:9000/.well-known/jwks.json}

# 예외 핸들러(common-starter)가 다루는 상태를 springdoc이 모든 오퍼레이션에 복사하지 않게 한다 —
# 켜 두면 GET에도 404·409가 달린다. 공통 오류는 OpenApiConfig의 OperationCustomizer가 규칙대로 붙인다.
springdoc:
  override-with-generic-response: false

# Actuator — 내부 네트워크 전용이다. 게이트웨이 라우트는 /api/**뿐이고 nginx도 /actuator를 넘기지 않는다.
# 인디케이터는 db·redis 기본값만 쓴다. MinIO·OpenSearch·org gRPC는 넣지 않는다 — 프로브가
# 남의 서비스를 때리면 그 서비스 장애가 이 서비스의 DOWN으로 번지고, 프로브 자체가 부하가 된다.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    eureka:
      enabled: false         # 유레카는 대시보드가 따로 본다(설계 §3)
  info:
    build:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

platform:
  jwt:
    issuer: ${PLATFORM_ISSUER:http://localhost:9000}
    audience: ${PLATFORM_AUDIENCE:platform-api}
  org:
    # 플랫폼 메일 허브(org-service)의 내부 API — 사용자 JWT가 아니라 X-Internal-Token으로 부른다.
    # 게이트웨이가 라우팅하지 않는 경로라 컨테이너 이름·내부 포트를 그대로 쓴다.
    internal:
      uri: ${ORG_INTERNAL_URI:http://localhost:9130}
      # 비면 org가 무조건 403이라 클라이언트가 호출조차 하지 않는다 — 그때는 메일 채널이 꺼진 것과 같다
      token: ${ORG_INTERNAL_TOKEN:}
  org-grpc:
    host: ${ORG_GRPC_HOST:localhost}
    port: ${ORG_GRPC_PORT:9131}
    # 권한·디렉터리 호출 데드라인. 콜드 스타트(연결 수립)까지 흡수해야 하므로 2초는 짧았다(첫 요청 503).
    deadline-seconds: ${ORG_GRPC_DEADLINE_SECONDS:5}
  grpc:
    enabled: ${ALM_GRPC_ENABLED:true}
    port: ${ALM_GRPC_PORT:9121}
  events:
    enabled: ${EVENTS_ENABLED:true}
    stream: ${EVENTS_STREAM:platform:events:v1}
  alm:
    mail:
      # 보낸 사람 주소·SMTP 설정은 org-service의 메일 설정이 정본이다(2026-09-07). 여기 남은 것은
      # 메일 본문의 이슈 링크가 가리킬 곳뿐 — 사용자가 브라우저로 여는 주소여야 한다.
      public-url: ${ALM_PUBLIC_URL:http://localhost/alm}
    trash:
      # 지라와 같은 60일. 프로젝트 응답의 purgeAt(= deleted_at + 이 값)이 화면에 "n일 후 영구 삭제"로 뜬다
      retention-days: ${ALM_TRASH_RETENTION_DAYS:60}
      # 인스턴스가 여럿이면 한 곳에서만 켜 둔다 — 겹쳐 돌아도 결과는 같지만 경합이 생긴다
      purge-cron: ${ALM_TRASH_PURGE_CRON:0 0 3 * * *}
      purge-enabled: ${ALM_TRASH_PURGE_ENABLED:true}
    storage:
      # 첨부 바이트 저장소. S3를 끄면 로컬 파일(개발·테스트) — 운영 compose는 MinIO를 켠다.
      files-dir: ${ALM_FILES_DIR:./data/attachments}
      s3:
        enabled: ${ALM_S3_ENABLED:false}
        bucket: ${ALM_S3_BUCKET:alm-attachments}
        region: ${ALM_S3_REGION:us-east-1}
        endpoint: ${ALM_S3_ENDPOINT:}
        path-style-access: ${ALM_S3_PATH_STYLE_ACCESS:true}
        access-key: ${ALM_S3_ACCESS_KEY:}
        secret-key: ${ALM_S3_SECRET_KEY:}

---
spring:
  config:
    activate:
      on-profile: docker
eureka:
  client:
    enabled: false
logging:
  structured:
    format:
      console: ecs

