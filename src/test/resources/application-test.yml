spring:
  datasource:
    url: jdbc:h2:mem:almdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
eureka:
  client:
    enabled: false
platform:
  grpc:
    enabled: false
  events:
    enabled: false
  alm:
    storage:
      files-dir: build/test-attachments
      s3:
        enabled: false
